server {
    listen 80;
    listen [::]:80;

    # Thư mục chứa mã nguồn tĩnh
    root /var/www/ptit-web/html;

    # Tệp tin mặc định sẽ được load khi truy cập vào thư mục gốc
    index index.html index.htm;

    # Tên miền (nếu không có tên miền, sử dụng _ làm mặc định cho mọi kết nối)
    server_name _;

    # Xử lý các request tới website
    location / {
        # Thử tìm tệp tin theo URI, nếu không thấy tìm thư mục, nếu vẫn không thấy trả về lỗi 404
        try_files $uri $uri/ =404;
    }
}
